# /srv/nginx-proxy/conf.d/serverstate.conf
# Cloudflare(HTTPS, Proxied) → 공유기 → nginx_proxy(80/443) → serverstate_grafana_prod:3000
# Cloudflare가 origin에 HTTPS로 연결하므로 443도 같이 listen해야 default_server로 빨려들어가지 않음.
# 인증서는 다른 서비스(heyvoca/openday/orderandgo)들과 동일한 Cloudflare Origin Cert 사용.

server {
    listen 80;
    listen 443 ssl;
    server_name serverstate.ghmate.com;
    ssl_certificate /etc/nginx/certs/cloudflare_chain.crt;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    # Docker 내장 DNS. 아래 변수 proxy_pass 와 함께 써야 요청마다 런타임 재확인이 동작한다.
    # → grafana 컨테이너가 재생성돼 IP 가 바뀌거나 잠깐 죽어도, 이 도메인만 영향받고
    #   nginx -t 는 통과해 다른 프로젝트의 공용 reload 를 막지 않는다(장애 전파 차단).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $up serverstate_grafana_prod;   # 변수로 넘겨야 nginx 가 요청마다 재확인 (문자열 직접지정=reload 시점 IP 캐시)
        proxy_pass http://$up:3000;
        proxy_http_version 1.1;             # Grafana Live(WebSocket) 대응
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}

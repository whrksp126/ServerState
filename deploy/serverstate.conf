# /srv/nginx-proxy/conf.d/serverstate.conf
# 사용자 → Cloudflare DNS(⚪ DNS only, 직통) → 공유기 → nginx_proxy(443) → serverstate_grafana_prod:3000
# 인증서: 공용 *.ghmate.com Let's Encrypt (snippets/ghmate-ssl.inc, 서버 cron 자동 갱신)
# 공용 설정(realip·제한 zone)은 conf.d/00-ghmate-common.conf. 롤백: /srv/nginx-proxy/bin/cf-dns.sh proxy serverstate.ghmate.com

server {
    listen 80;
    server_name serverstate.ghmate.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name serverstate.ghmate.com;
    include /etc/nginx/conf.d/snippets/ghmate-ssl.inc;

    # Docker 내장 DNS. 아래 변수 proxy_pass 와 함께 써야 요청마다 런타임 재확인이 동작한다.
    # → grafana 컨테이너가 재생성돼 IP 가 바뀌거나 잠깐 죽어도, 이 도메인만 영향받고
    #   nginx -t 는 통과해 다른 프로젝트의 공용 reload 를 막지 않는다(장애 전파 차단).
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req  zone=ghmate_req burst=200 nodelay;
    limit_conn ghmate_conn 100;

    location / {
        set $up serverstate_grafana_prod;   # 변수로 넘겨야 nginx 가 요청마다 재확인 (문자열 직접지정=reload 시점 IP 캐시)
        proxy_pass http://$up:3000;
        include /etc/nginx/conf.d/snippets/ghmate-proxy-headers.inc;   # Grafana Live(WebSocket) 포함
        proxy_read_timeout 300;
    }
}
